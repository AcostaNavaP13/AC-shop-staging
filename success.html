<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Shop - Compra Exitosa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .success-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
            padding: 20px;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background-color: #34C759;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 4px 14px rgba(52, 199, 89, 0.4);
        }
        .order-id-box {
            background-color: #F2F2F7;
            padding: 16px 24px;
            border-radius: 12px;
            margin: 24px 0;
            font-weight: 600;
            font-family: monospace;
            font-size: 1.2rem;
            color: #1C1C1E;
            border: 1px dashed #C7C7CC;
        }
        
        /* Dark mode support */
        body.dark-mode .order-id-box {
            background-color: #1C1C1E;
            color: #F2F2F7;
            border-color: #3A3A3C;
        }
    </style>
</head>
<body class="light-mode">
    <div class="success-container">
        <div class="success-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h1 style="font-size: 28px; margin-bottom: 12px;">¡Gracias por tu compra!</h1>
        <p style="color: #8E8E93; max-width: 400px; line-height: 1.5; margin-bottom: 8px;">
            Hemos recibido tu pedido correctamente.
            <br><br>
            <strong>Estatus:</strong> Pendiente por autorizar. Una vez que validemos el pago, nos pondremos en contacto para el envío.
        </p>
        
        <div class="order-id-box" id="order-id-display">
            Cargando pedido...
        </div>

        <a href="index.html" class="ios-btn primary-btn" style="text-decoration: none; width: auto; padding: 12px 32px;">Volver a la tienda</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="data.js"></script>
    <script>
        // Aplicar el mismo tema (claro/oscuro) que tenga el usuario en la tienda
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.replace('light-mode', 'dark-mode');
        }

        // Extraer parámetros de la URL que manda Mercado Pago
        const urlParams = new URLSearchParams(window.location.search);
        const paymentStatus = urlParams.get('collection_status'); // 'approved', 'pending', etc.
        const paymentType = urlParams.get('payment_type');
        const paymentId = urlParams.get('payment_id');

        let formattedPaymentType = "Mercado Pago";
        if (paymentType === 'ticket') formattedPaymentType = "Efectivo (OXXO/PayCash)";
        else if (paymentType === 'credit_card') formattedPaymentType = "Tarjeta de Crédito";
        else if (paymentType === 'debit_card') formattedPaymentType = "Tarjeta de Débito";
        else if (paymentType === 'account_money') formattedPaymentType = "Saldo Mercado Pago";
        
        // Ejecutar flujo asíncrono para poder hacer fetch del correo
        (async () => {
            // ✅ CASO 1: El usuario SÍ pagó (Mercado Pago nos redirigió con confirmación)
            if (paymentStatus === 'approved' || paymentStatus === 'pending') {
                // Recuperar carrito guardado antes de ir a MP
                const pendingCart = JSON.parse(localStorage.getItem('oa_mp_pending_cart') || '[]');
                const pendingCoupon = JSON.parse(localStorage.getItem('oa_mp_pending_coupon') || 'null');

                if (pendingCart.length > 0) {
                    let buyerEmail = "No proporcionado";
                    if (paymentId && paymentId !== "null") {
                        try {
                            const res = await fetch(`https://ac-shop-staging.vercel.app/get_payment_info?id=${paymentId}`);
                            if (res.ok) {
                                const data = await res.json();
                                if (data.email) buyerEmail = data.email;
                            }
                        } catch(e) { console.error("Error obteniendo correo:", e); }
                    }

                    // Crear el pedido en Firebase AHORA que sabemos que pagó
                    Database.createPendingOrder(pendingCart, pendingCoupon, formattedPaymentType, buyerEmail)
                        .then(({ orderId }) => {
                            document.getElementById('order-id-display').textContent = 'Pedido: ' + orderId;
                        })
                        .catch(err => {
                            console.error('Error al registrar pedido:', err);
                            document.getElementById('order-id-display').textContent = 'Revisa tu correo para el número de pedido.';
                        });
                }

                // Limpiar carrito y datos temporales
                localStorage.removeItem('oa_cart');
                localStorage.removeItem('oa_applied_coupon');
                localStorage.removeItem('oa_mp_pending_cart');
                localStorage.removeItem('oa_mp_pending_coupon');

                if (paymentStatus === 'pending') {
                    document.querySelector('p').innerHTML = `
                        Hemos recibido tu pedido correctamente.<br><br>
                        <strong>Estatus:</strong> Pago pendiente de acreditación (ej. OXXO). 
                        Una vez confirmado, nos pondremos en contacto para coordinar el envío.
                    `;
                }

            } else {
                // ❌ CASO 2: El usuario NO pagó (regresó sin pagar, o llegó directo a esta URL)
                // Restaurar el carrito que guardamos antes de ir a MP
                const pendingCart = localStorage.getItem('oa_mp_pending_cart');
                if (pendingCart) {
                    localStorage.setItem('oa_cart', pendingCart);
                    localStorage.removeItem('oa_mp_pending_cart');
                }
                const pendingCoupon = localStorage.getItem('oa_mp_pending_coupon');
                if (pendingCoupon) {
                    localStorage.setItem('oa_applied_coupon', pendingCoupon);
                    localStorage.removeItem('oa_mp_pending_coupon');
                }

                // Redirigir al usuario a la tienda con su carrito intacto
                window.location.href = 'index.html';
            }
        })();
    </script>
</body>
</html>
