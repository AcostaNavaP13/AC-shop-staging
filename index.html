<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <!-- Use Inter font to simulate iOS / Apple design -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link id="favicon" rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pantalla de Carga (Loading) -->
    <div id="oa-loading">
        <img id="loader-logo" src="logo.png" alt="Cargando O&A Luxury" />
    </div>

    <!-- Top Announcement Banner -->
    <div id="top-announcement" style="display:none; background-color: #000; color: white; text-align: center; padding: 10px 16px; font-size: 13px; font-weight: 500;">
        <span id="top-announcement-text"></span>
    </div>

    <!-- Top Navigation Bar -->
    <nav class="ios-nav">
        <div class="nav-content">
            <div style="display: flex; align-items: center;">
                <img src="logo.png" alt="O&A Logo" class="brand-logo" id="store-logo-img" style="height: 48px; object-fit: contain;">
                <span id="store-name-display" style="font-weight: 700; font-size: 20px; margin-left: 12px; letter-spacing: -0.5px;">O&A Luxury shop</span>
            </div>
            <div style="display: flex; gap: 16px; align-items: center;">
                <button onclick="toggleCart()" class="nav-link" style="background:none; border:none; cursor:pointer; position:relative; color: var(--apple-blue); display: inline-flex; align-items: center;" title="Ver Carrito">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span id="cart-badge" style="position: absolute; top: -6px; right: -8px; background: var(--apple-red); color: #FFF; font-size: 11px; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-weight: bold;">0</span>
                </button>
                <button id="theme-toggle" class="theme-btn ios-btn" style="width: auto; margin: 0; padding: 6px 14px; font-size: 14px; display: inline-flex; align-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg> Oscuro</button>
                <a href="admin.html" class="nav-link" style="display: inline-flex; align-items: center;" title="Acceso Admin">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <header class="page-header">
            <h2 id="hero-title-display">Luxury Collection</h2>
            <p id="hero-subtitle-display">Descubre el estilo O&A para ti.</p>
        </header>

        <!-- Search Bar -->
        <div style="max-width: 500px; margin: 0 auto 24px auto; position: relative;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:14px; top:50%; transform:translateY(-50%);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-input" placeholder="Buscar por nombre, marca, categoría..." class="ios-input" style="margin:0; padding-left:42px; border-radius:16px;" oninput="processFilters()" />
        </div>

        <!-- Banner Principal -->
        <div id="main-banner" style="display:none; margin-bottom: 24px;"></div>

        <!-- Sub-Banners de Categorías -->
        <div id="category-banners" style="display:none; gap:12px; margin-bottom:24px; overflow-x:auto; flex-wrap:nowrap;"></div>

        <!-- Catalog Section -->
        <div class="catalog-layout" style="display:flex; gap:32px; align-items: flex-start; margin-top:24px;">
            <!-- Filters Sidebar -->
            <aside id="filters-sidebar" style="width: 220px; flex-shrink: 0;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                    <h3 style="margin:0; font-size: 18px; font-weight:700;">Filtros</h3>
                </div>

                <div class="filter-section" style="border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px;">
                    <h4 style="font-size: 15px; font-weight: 600; margin-bottom: 16px; cursor: default;">Categoría</h4>
                    <div id="sidebar-categories" style="display:flex; flex-direction:column; gap:12px; max-height:200px; overflow-y:auto;"></div>
                </div>

                <div class="filter-section" style="border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 20px;">
                    <h4 style="font-size: 15px; font-weight: 600; margin-bottom: 16px; cursor: default;">Marca</h4>
                    <div id="sidebar-brands" style="display:flex; flex-direction:column; gap:12px; max-height:200px; overflow-y:auto;"></div>
                </div>

                <div class="filter-section" style="padding-bottom: 20px;">
                    <h4 style="font-size: 15px; font-weight: 600; margin-bottom: 16px; cursor: default;">Variantes</h4>
                    <div id="sidebar-sizes" style="display:flex; flex-direction:column; gap:12px; max-height:200px; overflow-y:auto;"></div>
                </div>
            </aside>

            <!-- Main Catalog Area -->
            <div style="flex: 1; min-width: 0;">
                <!-- Toolbar -->
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                    <div><span id="results-count" style="font-size: 16px; font-weight: 600; color: var(--text-primary);">0 Resultados</span></div>
                    <div style="display:flex; align-items:center; gap: 24px;">
                        <button id="toggle-sidebar-btn" onclick="toggleSidebar()" style="background:none; border:none; cursor:pointer; font-weight:500; font-size:14px; display:flex; align-items:center; gap:6px; color: var(--text-primary);">
                            Ocultar filtros <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"></path></svg>
                        </button>
                        
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-weight:500; font-size:14px; color: var(--text-secondary);">Ordenar por</span>
                            <select id="sort-price" onchange="processFilters()" style="margin:0; padding:6px 10px; width:auto; border:none; background:transparent; font-weight:600; font-size:14px; cursor:pointer; outline:none; color: var(--text-primary);">
                                <option value="">Relevancia</option>
                                <option value="asc">Precio: Menor a Mayor</option>
                                <option value="desc">Precio: Mayor a Menor</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Product Grid -->
                <div id="product-grid" class="grid">
                    <!-- Products will be injected here via JavaScript -->
                </div>
            </div>
        </div>

        <script>
            function toggleSidebar() {
                const sidebar = document.getElementById("filters-sidebar");
                const btn = document.getElementById("toggle-sidebar-btn");
                if (sidebar.style.display !== "none") {
                    sidebar.style.display = "none";
                    btn.innerHTML = 'Mostrar filtros <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"></path></svg>';
                } else {
                    sidebar.style.display = "block";
                    btn.innerHTML = 'Ocultar filtros <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"></path></svg>';
                }
            }
        </script>
    </main>

    <!-- Product Detail Modal -->
    <div id="product-modal" class="modal-overlay">
        <div class="modal-content split-modal" style="max-width: 850px; padding: 0; overflow: hidden; display: flex; flex-direction: row; position: relative;">
            <button onclick="closeProductModal()" style="position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.1); color: #000; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 20;">&times;</button>
            <div class="split-modal-left" style="flex: 1.2; position: relative; background: #f8f8f8; display: flex; align-items: center; justify-content: center; min-height: 350px;">
                <div id="product-modal-image-container" style="position: relative; width: 100%; height: 100%;">
                    <img id="product-modal-image" src="" alt="" style="width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0;">
                    <!-- Dots for Carousel -->
                    <div id="product-modal-dots" style="position: absolute; bottom: 16px; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 5;">
                    </div>
                </div>
            </div>
            <div class="split-modal-right" style="flex: 1; padding: 32px; text-align: left; display: flex; flex-direction: column; overflow-y: auto; max-height: 80vh;">
                <h2 id="product-modal-name" style="margin: 0 0 12px 0; font-size: 24px; font-weight: 700; line-height: 1.2;"></h2>
                <div id="product-modal-price-container" style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px;">
                    <span id="product-modal-price" style="font-size: 22px; font-weight: 700; color: var(--apple-blue);"></span>
                    <span id="product-modal-compare-price" style="font-size: 16px; text-decoration: line-through; color: var(--text-secondary); display: none;"></span>
                    <span id="product-modal-saving" style="font-size: 13px; font-weight: 600; color: white; display: none; background: var(--apple-red); padding: 2px 8px; border-radius: 6px;"></span>
                </div>
                <p id="product-modal-description" style="font-size: 15px; line-height: 1.6; color: var(--text-secondary); margin-bottom: 24px; flex-grow: 1;"></p>
                
                <div id="product-modal-action-container" style="margin-top: 24px;">
                    <!-- Action button will be injected here (either direct Add to Cart or Select Size) -->
                </div>
                
                <div id="product-modal-related-container" style="margin-top: 32px; border-top: 1px solid #E5E5EA; padding-top: 24px; display: none;">
                    <h3 style="font-size: 15px; margin: 0 0 16px 0; font-weight: 600;">Productos Similares</h3>
                    <div id="product-modal-related-grid" style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;">
                        <!-- Related products injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0;">Mi Carrito</h3>
                <button onclick="toggleCart()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-secondary);">&times;</button>
            </div>
            <div id="cart-items-container" style="max-height: 50vh; overflow-y: auto; text-align: left;">
                <!-- items injected via js -->
            </div>
            <div style="border-top: 1px solid #E5E5EA; margin-top: 15px; padding-top: 15px; text-align: left;" class="cart-footer-border">
                <div id="coupon-container" style="display: none; margin-bottom: 15px;">
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="cart-coupon-input" class="ios-input" placeholder="Código de Cupón" style="margin-bottom: 0; flex: 1; text-transform: uppercase;" />
                        <button onclick="applyCoupon()" class="ios-btn secondary-btn" style="width: auto; margin: 0; padding: 0 16px;">Aplicar</button>
                    </div>
                    <p id="coupon-message" style="font-size: 12px; margin-top: 8px; font-weight: 600;"></p>
                </div>
                <h3 style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <span style="font-size: 14px; color: var(--text-secondary);">Subtotal:</span>
                    <span id="cart-subtotal" style="font-size: 14px; color: var(--text-secondary);">$0.00</span>
                </h3>
                <h3 id="cart-discount-row" style="display: none; justify-content: space-between; margin-bottom: 10px; color: var(--apple-green);">
                    <span style="font-size: 14px;">Descuento:</span>
                    <span id="cart-discount" style="font-size: 14px;">-$0.00</span>
                </h3>
                <h3 style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px;">
                    <span>Total:</span>
                    <span id="cart-total">$0.00</span>
                </h3>
                <button id="checkout-btn" class="ios-btn" style="background-color: var(--apple-green); color: white;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: text-bottom;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    Comprar por WhatsApp
                </button>
                <button onclick="clearCart()" class="ios-btn secondary-btn" style="color: var(--apple-red); margin-top: 10px; padding: 10px;">Vaciar Carrito</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="theme.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
